<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reem.bi · YouTube</title>
  <meta name="description" content="reem.bi YouTube — כניסה לצפייה">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff0033'/%3E%3Cpath d='M26 20l20 12-20 12z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="landing">

  <!-- רקע: סרטונים מתחלפים -->
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="bg-shade" aria-hidden="true"></div>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="hero">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M25 19l22 13-22 13z"/></svg>
    </div>

    <h1 class="title">
      <span class="brand">reem.bi</span>
      <span class="yt">YouTube</span>
    </h1>

    <p class="tagline">כל הסרטונים, במקום אחד. נקי, שקט ובלי הסחות.</p>

    <a class="cta" id="enter" href="watch.html">
      <span class="cta-shine" aria-hidden="true"></span>
      <svg class="cta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span>כניסה לצפייה</span>
    </a>

    <div class="strip" id="strip" aria-hidden="true"></div>
  </main>

  <footer class="foot">© <span id="year"></span> reem.bi</footer>

  <script src="assets/config.js"></script>
  <script>
    (function () {
      var cfg = window.SITE_CONFIG || {};
      var ids = cfg.backgroundVideos || [];
      var bg = document.getElementById("bg");
      document.getElementById("year").textContent = new Date().getFullYear();

      // שורת תמונות ממוזערות עדינה מתחת לכפתור
      var strip = document.getElementById("strip");
      var track = document.createElement("div");
      track.className = "strip-track";
      // משכפלים כדי שהגלילה תהיה רציפה (והרצועה תהיה רחבה מספיק)
      var reel = ids;
      while (reel.length && reel.length < 6) reel = reel.concat(ids);
      if (reel.length) strip.appendChild(track);
      reel.concat(reel).forEach(function (id) {
        var img = document.createElement("img");
        img.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
        img.alt = "";
        img.loading = "lazy";
        img.onerror = function () { this.remove(); };
        track.appendChild(img);
      });

      // רקע: תמונת פתיחה מיידית + סרטון YouTube מושתק שמתחלף כל כמה שניות
      if (ids.length) bg.style.backgroundImage = "url(https://i.ytimg.com/vi/" + ids[0] + "/maxresdefault.jpg)";

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!ids.length || reduceMotion) return;

      var i = 0, current = null;
      function show(id) {
        var f = document.createElement("iframe");
        f.className = "bg-video";
        f.tabIndex = -1;
        f.setAttribute("allow", "autoplay; encrypted-media");
        f.src = "https://www.youtube-nocookie.com/embed/" + id +
          "?autoplay=1&mute=1&controls=0&loop=1&playlist=" + id +
          "&playsinline=1&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&start=20";
        bg.appendChild(f);
        // נותנים לסרטון להיטען ואז מעמעמים פנימה
        setTimeout(function () {
          f.classList.add("on");
          var old = current;
          current = f;
          if (old) setTimeout(function () { old.remove(); }, 2000);
        }, 2500);
      }
      show(ids[0]);
      if (ids.length > 1) {
        setInterval(function () { i = (i + 1) % ids.length; show(ids[i]); }, 22000);
      }
    })();

    // אנימציית יציאה לפני המעבר לדף הצפייה
    document.getElementById("enter").addEventListener("click", function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      var href = this.href;
      document.body.classList.add("leaving");
      setTimeout(function () { location.href = href; }, 650);
    });
    // חזרה עם כפתור "אחורה" מה-bfcache
    window.addEventListener("pageshow", function () { document.body.classList.remove("leaving"); });
  </script>
</body>
</html>
